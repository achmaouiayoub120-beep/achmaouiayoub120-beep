<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Ayoub Achmaoui – Cybersécurité, Cloud et Développement Full-Stack">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f16"/><stop offset=".6" stop-color="#0c1d24"/><stop offset="1" stop-color="#103840"/></linearGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#8af0e2"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".05"/></linearGradient>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#2DD4BF" stroke-opacity=".07"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
<clipPath id="clip"><rect width="1000" height="320" rx="20"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Fira Code','SF Mono',Consolas,'Liberation Mono',monospace}
.role{opacity:0;animation:cycle 9s infinite}
.r2{animation-delay:3s}.r3{animation-delay:6s}
@keyframes cycle{0%{opacity:0;transform:translateY(6px)}5%{opacity:1;transform:none}28%{opacity:1}33%{opacity:0}100%{opacity:0}}
.cur{animation:blink 1s steps(2,start) infinite}@keyframes blink{50%{opacity:0}}
.scan{animation:scan 7s linear infinite}@keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(330px)}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style>
<g clip-path="url(#clip)">
<rect width="1000" height="320" fill="url(#bg)"/>
<rect width="1000" height="320" fill="url(#grid)"/>
<circle cx="845" cy="145" r="150" fill="#2DD4BF" opacity=".22" filter="url(#blur)"/>
<circle cx="60" cy="320" r="130" fill="#22d3ee" opacity=".12" filter="url(#blur)"/>
<rect class="scan" width="1000" height="2" fill="#2DD4BF" opacity=".22"/>
<circle cx="610" cy="60" r="2" fill="#2DD4BF" opacity=".15"><animate attributeName="opacity" values=".08;.7;.08" dur="3s" begin="0s" repeatCount="indefinite"/></circle><circle cx="700" cy="270" r="2" fill="#2DD4BF" opacity=".15"><animate attributeName="opacity" values=".08;.7;.08" dur="4s" begin="1s" repeatCount="indefinite"/></circle><circle cx="960" cy="40" r="2" fill="#2DD4BF" opacity=".15"><animate attributeName="opacity" values=".08;.7;.08" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle><circle cx="560" cy="210" r="2" fill="#2DD4BF" opacity=".15"><animate attributeName="opacity" values=".08;.7;.08" dur="5s" begin="2s" repeatCount="indefinite"/></circle><circle cx="930" cy="285" r="2" fill="#2DD4BF" opacity=".15"><animate attributeName="opacity" values=".08;.7;.08" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle><circle cx="655" cy="150" r="2" fill="#2DD4BF" opacity=".15"><animate attributeName="opacity" values=".08;.7;.08" dur="4s" begin="2.5s" repeatCount="indefinite"/></circle>
</g>
<rect x=".5" y=".5" width="999" height="319" rx="20" fill="none" stroke="#1f2d3a"/>

<!-- label -->
<rect x="48" y="38" width="28" height="2" fill="#2DD4BF"/>
<text x="86" y="44" class="mono" font-size="12" letter-spacing="4" fill="#2DD4BF">PORTFOLIO  /  2026</text>

<!-- name -->
<text x="46" y="114" class="sans" font-size="58" font-weight="800" letter-spacing="1" fill="url(#nm)">AYOUB ACHMAOUI</text>
<text x="48" y="148" class="sans" font-size="19" fill="#9fb3c0">Cybersécurité  ·  Cloud  ·  Développement Full-Stack</text>

<!-- terminal -->
<rect x="48" y="172" width="480" height="104" rx="12" fill="#070b10" fill-opacity=".85" stroke="#1f2d3a"/>
<circle cx="66" cy="188" r="4" fill="#ff5f57"/><circle cx="82" cy="188" r="4" fill="#febc2e"/><circle cx="98" cy="188" r="4" fill="#28c840"/>
<text x="68" y="226" class="mono" font-size="15" fill="#2DD4BF">$</text>
<text x="86" y="226" class="mono" font-size="15" fill="#e6edf3">whoami</text>
<rect class="cur" x="146" y="213" width="9" height="16" fill="#2DD4BF"/>
<text x="68" y="254" class="mono" font-size="15" fill="#22d3ee">&gt;</text>
<g class="mono" font-size="15" fill="#e6edf3">
<text class="role r1" x="86" y="254">Étudiant Cybersécurité &amp; Technologies Cloud</text>
<text class="role r2" x="86" y="254">Développeur Full-Stack Web &amp; Mobile</text>
<text class="role r3" x="86" y="254">Recherche un stage de fin d'études (PFE)</text>
</g>

<!-- shield emblem -->
<g>
<g><animateTransform attributeName="transform" type="rotate" from="0 845 145" to="360 845 145" dur="26s" repeatCount="indefinite"/>
<circle cx="845" cy="145" r="108" fill="none" stroke="#2DD4BF" stroke-opacity=".4" stroke-dasharray="3 9"/><circle cx="944.4745873523116" cy="187.05718096933424" r="4.5" fill="#2DD4BF"/><circle cx="758.4764895209312" cy="209.6349915632273" r="4.5" fill="#2DD4BF"/><circle cx="801.7136894153626" cy="46.054078831058874" r="4.5" fill="#2DD4BF"/></g>
<g><animateTransform attributeName="transform" type="rotate" from="360 845 145" to="0 845 145" dur="38s" repeatCount="indefinite"/>
<circle cx="845" cy="145" r="80" fill="none" stroke="#22d3ee" stroke-opacity=".3"/><circle cx="873.9886203581339" cy="219.5631268773781" r="3.5" fill="#22d3ee"/><circle cx="786.9254156639888" cy="89.9787072652821" r="3.5" fill="#22d3ee"/></g>
<g transform="translate(845,145) scale(.78)">
<path d="M0 -68L56 -44V6C56 44 24 68 0 80C-24 68 -56 44 -56 6V-44Z" fill="url(#sh)" stroke="#2DD4BF" stroke-width="3.5" stroke-linejoin="round"/>
<path d="M-24 6L-6 24L28 -16" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>

<!-- chips -->
<rect x="620" y="262" width="150" height="30" rx="15" fill="#070b10" fill-opacity=".8" stroke="#1f2d3a"/>
<text x="695" y="282" class="sans" font-size="13" fill="#c5d1db" text-anchor="middle">El Jadida, Maroc</text>
<rect x="782" y="262" width="172" height="30" rx="15" fill="#2DD4BF" fill-opacity=".12" stroke="#2DD4BF" stroke-opacity=".6"/>
<circle class="pulse" cx="802" cy="277" r="4" fill="#2DD4BF"/>
<text x="876" y="282" class="sans" font-size="13" font-weight="600" fill="#2DD4BF" text-anchor="middle">Stage PFE disponible</text>
</svg>