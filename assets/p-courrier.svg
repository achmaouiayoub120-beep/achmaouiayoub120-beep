<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="490" height="218" rx="18"/></clipPath>
</defs>
<style>.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Fira Code','SF Mono',Consolas,'Liberation Mono',monospace}</style>
<rect x=".5" y=".5" width="489" height="217" rx="18" fill="#0d1520" stroke="#1f2d3a"/>
<g clip-path="url(#c)">
<circle cx="470" cy="-20" r="110" fill="#2DD4BF" opacity=".08"/>
