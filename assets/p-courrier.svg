<g transform="translate(35,35) scale(1.0)" stroke="#fff" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></g>
<text x="86" y="44" class="sans" font-size="18" font-weight="700" fill="#e6edf3">Système de Gestion du Courrier</text>
<text x="86" y="64" class="mono" font-size="12" fill="#8b98a5">Projet de fin d'études · 2026</text>
<text x="26" y="108" class="sans" font-size="13.5" fill="#b8c4d0">Plateforme web qui digitalise le courrier interne de</text><text x="26" y="129" class="sans" font-size="13.5" fill="#b8c4d0">l'EST : authentification sécurisée, rôles (admin, agent,</text><text x="26" y="150" class="sans" font-size="13.5" fill="#b8c4d0">archiviste), traçabilité et tableau de bord de suivi.</text>
